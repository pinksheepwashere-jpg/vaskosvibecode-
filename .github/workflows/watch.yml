name: Roommatch watcher
 
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # lets you start a run by hand from the Actions tab
 
permissions:
  contents: write             # needed to save the list of rooms already alerted
 
concurrency:
  group: roommatch
  cancel-in-progress: false
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Check Roommatch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 roommatch_watcher.py --once
 
      - name: Save alerted rooms
        run: |
          git config user.name "roommatch-bot"
          git config user.email "roommatch-bot@users.noreply.github.com"
          git add roommatch_seen.json
          git diff --cached --quiet || (git commit -m "Update seen rooms" && git push)
 
